version: '3.8'

services:
  keycloak-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    networks:
      - expense-net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: always
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    depends_on:
      - keycloak-db
    networks:
      - expense-net

  expenseservice:
    build:
      context: ./ExpenseService
    ports:
      - "8080:80"
    volumes:
      - ./ExpenseService/expenses.db:/app/expenses.db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Keycloak__Authority=http://keycloak:8080/realms/MyRealm
      - Keycloak__ClientId=dotnet-api
    depends_on:
      - keycloak
    networks:
      - expense-net

  reportservice:
    build:
      context: ./ReportService
    depends_on:
      - expenseservice
    ports:
      - "8081:81"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Keycloak__Authority=http://keycloak:8080/realms/MyRealm
      - Keycloak__ClientId=dotnet-api
    networks:
      - expense-net

networks:
  expense-net:
    driver: bridge
