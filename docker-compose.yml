version: '3.8'

services:
  keycloak-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    networks:
      - expense-net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: always
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    depends_on:
      - keycloak-db
    networks:
      - expense-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - expense-net

  expenseservice:
    build:
      context: ./ExpenseService
    ports:
      - "8080:80"
    volumes:
      - ./ExpenseService/expenses.db:/app/expenses.db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Keycloak__Authority=http://keycloak:8080/realms/MyRealm
      - Keycloak__ClientId=expense-service
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
    depends_on:
      - keycloak
      - rabbitmq
    networks:
      - expense-net

  reportservice:
    build:
      context: ./ReportService
    depends_on:
      - expenseservice
    ports:
      - "8081:81"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Keycloak__Authority=http://keycloak:8080/realms/MyRealm
      - Keycloak__ClientId=report-service
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
    networks:
      - expense-net

networks:
  expense-net:
    driver: bridge
